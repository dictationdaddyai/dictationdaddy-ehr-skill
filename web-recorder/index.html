<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DictationDaddy EHR Recorder</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #f7f7f4;
        color: #20231f;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 18px 48px;
      }
      h1 {
        font-size: 24px;
        line-height: 1.2;
        margin: 0 0 18px;
      }
      h2 {
        font-size: 16px;
        margin: 28px 0 10px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 650;
        margin: 14px 0 6px;
      }
      input,
      textarea,
      select {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid #c9c9c2;
        border-radius: 6px;
        padding: 10px 11px;
        font: inherit;
        background: #fff;
        color: #20231f;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 160px;
        gap: 12px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      button {
        border: 1px solid #20231f;
        border-radius: 6px;
        background: #20231f;
        color: #fff;
        font: inherit;
        font-weight: 650;
        padding: 10px 13px;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: #20231f;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        color: #55584f;
      }
      .panel {
        border-top: 1px solid #d9d9d2;
        padding-top: 18px;
        margin-top: 18px;
      }
      .history-item {
        border: 1px solid #d9d9d2;
        border-radius: 6px;
        padding: 12px;
        margin: 10px 0;
        background: #fff;
      }
      .history-meta {
        font-size: 12px;
        color: #66695f;
        margin-bottom: 8px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
      }
      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DictationDaddy EHR Recorder</h1>

      <div class="row">
        <div>
          <label for="token">Firebase ID token</label>
          <input id="token" type="password" autocomplete="off" />
        </div>
        <div>
          <label for="model">Model</label>
          <select id="model">
            <option value="medical" selected>medical</option>
            <option value="enhanced">enhanced</option>
            <option value="standard">standard</option>
            <option value="instant">instant</option>
            <option value="ultra">ultra</option>
          </select>
        </div>
      </div>

      <label for="endpoint">Endpoint</label>
      <input id="endpoint" value="https://api.dictationdaddy.workers.dev" />

      <label for="context">Transcription context</label>
      <textarea id="context">Transcribe this audio as accurately as possible. Preserve dictated wording and uncertainty. Do not format as a final note.</textarea>

      <div class="buttons">
        <button id="start">Start recording</button>
        <button id="stop" disabled>Stop</button>
        <button id="send" disabled>Send to DictationDaddy</button>
        <button id="copy" class="secondary" disabled>Copy latest transcript</button>
        <button id="clear" class="secondary">Clear history</button>
      </div>

      <div id="status" class="status">Idle.</div>

      <section class="panel">
        <h2>Latest Transcript</h2>
        <pre id="latest"></pre>
      </section>

      <section class="panel">
        <h2>Local History</h2>
        <div id="history"></div>
      </section>
    </main>

    <script>
      const els = {
        token: document.getElementById("token"),
        endpoint: document.getElementById("endpoint"),
        model: document.getElementById("model"),
        context: document.getElementById("context"),
        start: document.getElementById("start"),
        stop: document.getElementById("stop"),
        send: document.getElementById("send"),
        copy: document.getElementById("copy"),
        clear: document.getElementById("clear"),
        status: document.getElementById("status"),
        latest: document.getElementById("latest"),
        history: document.getElementById("history"),
      };

      let mediaRecorder = null;
      let chunks = [];
      let latestBlob = null;

      function historyItems() {
        try {
          return JSON.parse(localStorage.getItem("dd_ehr_history") || "[]");
        } catch {
          return [];
        }
      }

      function saveHistory(items) {
        localStorage.setItem("dd_ehr_history", JSON.stringify(items.slice(0, 50)));
      }

      function renderHistory() {
        const items = historyItems();
        els.history.innerHTML = "";
        if (!items.length) {
          els.history.textContent = "No local history yet.";
          return;
        }
        for (const item of items) {
          const node = document.createElement("div");
          node.className = "history-item";
          node.innerHTML = `<div class="history-meta">${item.createdAt} · ${item.model}</div><pre></pre>`;
          node.querySelector("pre").textContent = item.result;
          els.history.appendChild(node);
        }
      }

      function setStatus(text) {
        els.status.textContent = text;
      }

      els.start.addEventListener("click", async () => {
        chunks = [];
        latestBlob = null;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) chunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
          latestBlob = new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
          stream.getTracks().forEach((track) => track.stop());
          els.send.disabled = false;
          setStatus(`Recorded ${(latestBlob.size / 1024).toFixed(1)} KB locally.`);
        };
        mediaRecorder.start();
        els.start.disabled = true;
        els.stop.disabled = false;
        els.send.disabled = true;
        setStatus("Recording...");
      });

      els.stop.addEventListener("click", () => {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
        els.start.disabled = false;
        els.stop.disabled = true;
      });

      els.send.addEventListener("click", async () => {
        if (!latestBlob) return;
        const token = els.token.value.trim();
        if (!token) {
          setStatus("Firebase ID token is required.");
          return;
        }
        const form = new FormData();
        form.append("audio", latestBlob, "recording.webm");
        form.append("sessionId", String(Date.now()));
        form.append("source", "claude-code-web-recorder");
        form.append("model", els.model.value);
        form.append("context", els.context.value);
        form.append("language", "en");
        form.append("knowledge", "{}");
        form.append("keywords", "[]");
        form.append("extra", JSON.stringify({ style: "formal" }));

        els.send.disabled = true;
        setStatus("Uploading to DictationDaddy...");
        try {
          const response = await fetch(els.endpoint.value.trim(), {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: form,
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}`);
          }
          const result = data.result || "";
          els.latest.textContent = result;
          els.copy.disabled = !result;
          const items = historyItems();
          items.unshift({
            createdAt: new Date().toISOString(),
            model: els.model.value,
            result,
          });
          saveHistory(items);
          renderHistory();
          setStatus("Transcription complete. Copy it into Claude Code for EHR formatting.");
        } catch (error) {
          setStatus(`Failed: ${error.message}`);
        } finally {
          els.send.disabled = false;
        }
      });

      els.copy.addEventListener("click", async () => {
        await navigator.clipboard.writeText(els.latest.textContent);
        setStatus("Latest transcript copied.");
      });

      els.clear.addEventListener("click", () => {
        localStorage.removeItem("dd_ehr_history");
        renderHistory();
        setStatus("Local history cleared.");
      });

      renderHistory();
    </script>
  </body>
</html>
